<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Akademik Link</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        /* Kustomisasi animasi pulse lembut untuk jam */
        .clock-glow {
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
        }
        /* Efek glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white antialiased flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <!-- Efek cahaya latar belakang -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-blob"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-blob animation-delay-2000"></div>

    <main class="w-full max-w-md relative z-10 py-10 flex flex-col gap-8">
        
        <header class="text-center glass-card p-6 rounded-3xl shadow-2xl">
            <div id="time" class="text-5xl md:text-6xl font-bold tracking-tight text-blue-100 clock-glow mb-2">
                00:00:00
            </div>
            <div id="date" class="text-sm md:text-base text-blue-200/80 font-medium tracking-wide uppercase">
                Memuat tanggal...
            </div>
        </header>

        <section class="flex flex-col gap-3">
            <h2 class="text-xs font-semibold text-blue-300 uppercase tracking-widest px-2 mb-1 flex items-center gap-2">
                <i class="fas fa-book-open"></i> Pembelajaran
            </h2>
            
            <a href="#link-sistem-hukum" class="glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center group-hover:bg-blue-500/40 transition-colors text-blue-300">
                        <i class="fas fa-scale-balanced"></i>
                    </div>
                    <span class="font-medium">Sistem Hukum Indonesia</span>
                </div>
                <i class="fas fa-chevron-right text-sm opacity-50 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
            </a>

            <a href="#link-hukum-pidana" class="glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center group-hover:bg-red-500/40 transition-colors text-red-300">
                        <i class="fas fa-gavel"></i>
                    </div>
                    <span class="font-medium">Hukum Pidana</span>
                </div>
                <i class="fas fa-chevron-right text-sm opacity-50 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
            </a>
        </section>

        <section class="flex flex-col gap-3">
            <h2 class="text-xs font-semibold text-blue-300 uppercase tracking-widest px-2 mb-1 flex items-center gap-2">
                <i class="fas fa-briefcase"></i> Akademik
            </h2>

            <a href="#link-pengumpulan-tugas" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold text-center shadow-lg shadow-blue-500/30 transform transition-all duration-300 hover:-translate-y-1 hover:shadow-blue-500/50 flex items-center justify-center gap-3">
                <i class="fas fa-upload"></i>
                Pengumpulan Tugas
            </a>

            <a href="#link-jadwal-perkuliahan" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white font-semibold text-center shadow-lg shadow-purple-500/30 transform transition-all duration-300 hover:-translate-y-1 hover:shadow-purple-500/50 flex items-center justify-center gap-3">
                <i class="far fa-calendar-alt"></i>
                Jadwal Perkuliahan
            </a>
        </section>

        <footer class="mt-6">
            <div class="flex items-center justify-center gap-6">
                <a href="#link-whatsapp" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-xl text-gray-300 hover:text-green-400 hover:scale-110 hover:bg-white/10 transition-all duration-300" aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="#link-instagram" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-xl text-gray-300 hover:text-pink-400 hover:scale-110 hover:bg-white/10 transition-all duration-300" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#link-facebook" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-xl text-gray-300 hover:text-blue-500 hover:scale-110 hover:bg-white/10 transition-all duration-300" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#link-youtube" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-xl text-gray-300 hover:text-red-500 hover:scale-110 hover:bg-white/10 transition-all duration-300" aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
            <p class="text-center text-xs text-slate-500 mt-6 font-light tracking-wide">
                © <span id="currentYear"></span> Portal Hukum. All rights reserved.
            </p>
        </footer>

    </main>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Konfigurasi opsi waktu
            const timeOptions = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: false // Menggunakan format 24 jam
            };
            
            // Konfigurasi opsi tanggal (Bahasa Indonesia)
            const dateOptions = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };

            // Mengambil string waktu dan mengganti titik menjadi titik dua (untuk format jam id-ID tertentu)
            let timeString = now.toLocaleTimeString('id-ID', timeOptions).replace(/\./g, ':');
            let dateString = now.toLocaleDateString('id-ID', dateOptions);

            // Update DOM
            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
            document.getElementById('currentYear').textContent = now.getFullYear();
        }

        // Memanggil fungsi pertama kali agar tidak ada jeda 1 detik saat dimuat
        updateClock();
        
        // Memperbarui jam setiap 1 detik (1000 ms)
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
