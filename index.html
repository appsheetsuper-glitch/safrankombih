<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>safran kombih</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb;
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #d1d5db 100%);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

        ::-webkit-scrollbar {
            width: 0px;
        }

        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            transition: all 0.5s ease;
        }
        .btn-shimmer:hover::after {
            left: 150%;
            transition: all 0.7s ease;
        }
    </style>
</head>

<body class="min-h-screen text-gray-900 antialiased flex items-center justify-center p-4 py-12 relative">

    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[400px] bg-white rounded-full filter blur-[120px] opacity-80 pointer-events-none z-0"></div>

    <!-- Main Container -->
    <main class="w-full max-w-[380px] my-auto bg-white/40 backdrop-blur-2xl border border-white/60 rounded-[2.5rem] p-8 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.1)] animate-float relative z-10">
        
        <header class="mb-8 fade-in-up delay-100">
            <!-- Profile Section (Horizontal) -->
            <div class="flex items-center gap-4 mb-6">
                <!-- Profile Image -->
                <div class="relative w-16 h-16 shrink-0">
                    <div class="absolute inset-0 bg-black/5 rounded-full blur-md transform translate-y-1"></div>
                    <img 
                        src="profile.jpg" 
                        alt="Safran Kombih, M.H" 
                        onerror="this.src='https://placehold.co/150x150/000/fff?text=SK'"
                        class="relative w-full h-full object-cover rounded-full border-2 border-white shadow-sm"
                    >
                </div>
                
                <!-- Profile Info -->
                <div class="flex flex-col">
                    <h1 class="text-lg font-bold text-black tracking-tight leading-tight">Safran Kombih, M.H</h1>
                    <p class="text-[10px] font-semibold text-gray-500 uppercase tracking-[0.15em] mt-0.5">Dosen Ilmu Hukum</p>
                </div>
            </div>

            <!-- Digital Clock Section (Centered below profile) -->
            <div class="text-center pt-2 border-t border-black/5">
                <div id="time" class="text-5xl font-bold tracking-tighter text-black mb-1 tabular-nums">
                    00:00:00
                </div>
                <div id="date" class="text-[9px] text-gray-400 font-bold tracking-[0.2em] uppercase">
                    Memuat tanggal...
                </div>
            </div>
        </header>

        <div class="flex flex-col gap-6">
            
            <!-- Section Pembelajaran -->
            <section class="flex flex-col gap-3 fade-in-up delay-200">
                <div class="flex items-center gap-3 mb-1">
                    <div class="h-[1px] flex-grow bg-gradient-to-r from-transparent to-gray-300"></div>
                    <h2 class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] flex items-center gap-2">
                        <i class="fas fa-book-open text-xs"></i> Pembelajaran
                    </h2>
                    <div class="h-[1px] flex-grow bg-gradient-to-l from-transparent to-gray-300"></div>
                </div>
                
                <!-- Tombol Sistem Hukum -->
                <a href="hki.html" class="group relative w-full h-14 px-4 rounded-2xl bg-white/50 border border-white/60 hover:bg-white hover:shadow-[0_8px_20px_rgba(0,0,0,0.05)] hover:-translate-y-0.5 transition-all duration-300 flex items-center">
                    <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 group-hover:text-black group-hover:bg-gray-200 transition-colors shrink-0 shadow-sm">
                        <i class="fas fa-scale-balanced text-sm"></i>
                    </div>
                    <span class="font-semibold text-sm ml-4 flex-grow text-gray-700 group-hover:text-black transition-colors">Sistem Hukum Indonesia</span>
                    <i class="fas fa-chevron-right text-xs text-gray-300 group-hover:text-black group-hover:translate-x-1 transition-all shrink-0"></i>
                </a>

                <!-- Tombol Hukum Pidana -->
                <a href="hpi.html" class="group relative w-full h-14 px-4 rounded-2xl bg-white/50 border border-white/60 hover:bg-white hover:shadow-[0_8px_20px_rgba(0,0,0,0.05)] hover:-translate-y-0.5 transition-all duration-300 flex items-center">
                    <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 group-hover:text-black group-hover:bg-gray-200 transition-colors shrink-0 shadow-sm">
                        <i class="fas fa-gavel text-sm"></i>
                    </div>
                    <span class="font-semibold text-sm ml-4 flex-grow text-gray-700 group-hover:text-black transition-colors">Hukum Pidana</span>
                    <i class="fas fa-chevron-right text-xs text-gray-300 group-hover:text-black group-hover:translate-x-1 transition-all shrink-0"></i>
                </a>
            </section>

            <!-- Section Akademik -->
            <section class="flex flex-col gap-3 fade-in-up delay-300">
                <div class="flex items-center gap-3 mb-1">
                    <div class="h-[1px] flex-grow bg-gradient-to-r from-transparent to-gray-300"></div>
                    <h2 class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] flex items-center gap-2">
                        <i class="fas fa-briefcase text-xs"></i> Akademik
                    </h2>
                    <div class="h-[1px] flex-grow bg-gradient-to-l from-transparent to-gray-300"></div>
                </div>

                <!-- Tombol Pengumpulan Tugas -->
                <a href="https://forms.gle/EdtG2euWBaYspqKGA" class="group btn-shimmer w-full h-14 px-4 rounded-2xl bg-black text-white hover:bg-gray-900 transition-all duration-300 flex items-center shadow-[0_8px_20px_rgba(0,0,0,0.15)] hover:-translate-y-0.5">
                    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0">
                        <i class="fas fa-upload text-sm"></i>
                    </div>
                    <span class="font-bold text-sm ml-4 flex-grow text-left">Pengumpulan Tugas</span>
                    <i class="fas fa-arrow-right text-xs opacity-70 group-hover:opacity-100 group-hover:translate-x-1 transition-all shrink-0"></i>
                </a>

                <!-- Tombol Jadwal Perkuliahan -->
                <a href="https://docs.google.com/document/d/15lOzTp8KTRsKIQWDE4pP1uQsnhBy0FxJuNgtv_mXSvk/edit?usp=drive_link" class="group relative w-full h-14 px-4 rounded-2xl bg-white/50 border border-white/60 hover:bg-white hover:shadow-[0_8px_20px_rgba(0,0,0,0.05)] hover:-translate-y-0.5 transition-all duration-300 flex items-center">
                    <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 group-hover:text-black group-hover:bg-gray-200 transition-colors shrink-0 shadow-sm">
                        <i class="far fa-calendar-alt text-sm"></i>
                    </div>
                    <span class="font-semibold text-sm ml-4 flex-grow text-gray-700 group-hover:text-black transition-colors">Jadwal Perkuliahan</span>
                    <i class="fas fa-chevron-right text-xs text-gray-300 group-hover:text-black group-hover:translate-x-1 transition-all shrink-0"></i>
                </a>

                <!-- Tombol Absensi -->
                <a href="#link-absensi" class="group relative w-full h-14 px-4 rounded-2xl bg-white/50 border border-white/60 hover:bg-white hover:shadow-[0_8px_20px_rgba(0,0,0,0.05)] hover:-translate-y-0.5 transition-all duration-300 flex items-center">
                    <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 group-hover:text-black group-hover:bg-gray-200 transition-colors shrink-0 shadow-sm">
                        <i class="fas fa-user-check text-sm"></i>
                    </div>
                    <span class="font-semibold text-sm ml-4 flex-grow text-gray-700 group-hover:text-black transition-colors">Absensi Perkuliahan</span>
                    <i class="fas fa-chevron-right text-xs text-gray-300 group-hover:text-black group-hover:translate-x-1 transition-all shrink-0"></i>
                </a>
            </section>

        </div>

        <footer class="mt-10 fade-in-up delay-400">
            <div class="flex items-center justify-center gap-5">
                <a href="#link-whatsapp" class="w-10 h-10 rounded-full border border-white/60 bg-white/50 flex items-center justify-center text-sm text-gray-500 hover:text-black hover:bg-white hover:-translate-y-1 hover:shadow-[0_8px_15px_rgba(0,0,0,0.05)] transition-all duration-300" aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="#link-instagram" class="w-10 h-10 rounded-full border border-white/60 bg-white/50 flex items-center justify-center text-sm text-gray-500 hover:text-black hover:bg-white hover:-translate-y-1 hover:shadow-[0_8px_15px_rgba(0,0,0,0.05)] transition-all duration-300" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#link-facebook" class="w-10 h-10 rounded-full border border-white/60 bg-white/50 flex items-center justify-center text-sm text-gray-500 hover:text-black hover:bg-white hover:-translate-y-1 hover:shadow-[0_8px_15px_rgba(0,0,0,0.05)] transition-all duration-300" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#link-youtube" class="w-10 h-10 rounded-full border border-white/60 bg-white/50 flex items-center justify-center text-sm text-gray-500 hover:text-black hover:bg-white hover:-translate-y-1 hover:shadow-[0_8px_15px_rgba(0,0,0,0.05)] transition-all duration-300" aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
            
            <p class="text-center text-[9px] text-gray-400 mt-8 font-bold tracking-[0.2em] uppercase fade-in-up delay-500">
                © <span id="currentYear"></span> safran kombih
            </p>
        </footer>

    </main>

    <script>
        function updateClock() {
            const now = new Date();
            
            const timeOptions = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: false 
            };
            
            const dateOptions = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };

            let timeString = now.toLocaleTimeString('id-ID', timeOptions).replace(/\./g, ':');
            let dateString = now.toLocaleDateString('id-ID', dateOptions);

            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
            document.getElementById('currentYear').textContent = now.getFullYear();
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
